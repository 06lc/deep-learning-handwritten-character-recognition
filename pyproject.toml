[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdb-recognizer"
version = "1.0.0"
description = "Modern PyTorch CASIA-HWDB-1.1 handwritten character recognizer"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "numpy>=2,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
deploy = [
    "onnx>=1.16,<2",
    "onnxruntime-gpu>=1.19,<2",
]

[tool.setuptools]
py-modules = ["config", "compression", "gnt_dataset", "model", "predict", "train", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

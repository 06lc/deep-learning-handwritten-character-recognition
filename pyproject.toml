[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdb-recognizer"
version = "1.0.0"
description = "Modern PyTorch CASIA-HWDB-1.1 handwritten character recognizer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
    "numpy>=2,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = ["config", "gnt_dataset", "model", "predict", "train", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
